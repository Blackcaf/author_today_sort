name: Author.Today autocomplete smoke test

on:
  pull_request:
    branches: ["master"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test public Author.Today autocomplete sources
        run: |
          python - <<'PY'
          from webapp import _parse_genre_catalog, genres, tag_suggestions
          from advanced_search import AuthorTodayClient

          genre_result = genres()
          genre_names = {item["name"].casefold() for item in genre_result["genres"]}
          print("Genre count:", len(genre_names))
          print("Fantasy genre found:", "фэнтези" in genre_names)
          assert "фэнтези" in genre_names

          client = AuthorTodayClient(delay=0.0)
          try:
              sample = client.get_work_detail("553566", refresh_if_no_tags=True)
              print("Known work tags:", sample.tags)
              assert "система" in {tag.casefold() for tag in sample.tags}
          finally:
              client.close()

          suggestions = tag_suggestions("система")
          print("Tag suggestions:", suggestions["tags"])
          assert any(tag.casefold() == "система" for tag in suggestions["tags"])
          PY
