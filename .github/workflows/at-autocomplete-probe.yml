name: Author.Today autocomplete API probe

on:
  pull_request:
    branches: ["master"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Inspect Author.Today v2 tag response
        run: |
          python - <<'PY'
          import json
          import requests

          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36",
              "Accept-Language": "ru,en;q=0.9",
          })
          for query in ["сист", "система", "фентези", "попадан"]:
              response = s.get(
                  "https://api.author.today/v2/work/tags",
                  params={"query": query},
                  headers={"Authorization": "Bearer guest", "Accept": "application/json"},
                  timeout=20,
              )
              print("QUERY", query, "STATUS", response.status_code, "LENGTH", len(response.content))
              payload = response.json()
              data = payload.get("data")
              print("ROOT", json.dumps({k:v for k,v in payload.items() if k != "data"}, ensure_ascii=False))
              print("DATA_TYPE", type(data).__name__)
              if isinstance(data, dict):
                  print("DATA_KEYS", list(data))
                  for key, value in data.items():
                      if isinstance(value, list):
                          print("DATA_LIST", key, "LEN", len(value), "SAMPLE", json.dumps(value[:15], ensure_ascii=False))
                      else:
                          print("DATA_VALUE", key, repr(value)[:500])
              elif isinstance(data, list):
                  print("DATA_LIST ROOT", len(data), json.dumps(data[:20], ensure_ascii=False))
              else:
                  print("DATA", repr(data)[:2000])
          PY
